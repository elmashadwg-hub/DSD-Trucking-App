<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSD Trucking</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
    }

    header {
      background: #1b1b1b;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 6px 0 0;
      color: #aaa;
    }

    .container {
      padding: 18px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: #1d1d1d;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 15px;
      border: 1px solid #333;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #bbb;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #444;
      background: #292929;
      color: white;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #20c55a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-top: 5px;
    }

    button:active {
      transform: scale(.98);
    }

    .status {
      background: #252525;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }

    .step {
      color: #20c55a;
      font-weight: bold;
    }
  </style>
</head>

  <p>Daily Driver & Fleet Management</p>
</header>
